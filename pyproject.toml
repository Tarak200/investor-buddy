[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "api",
    "config",
    "evaluation",
    "frontend",
    "llm",
    "models",
    "retrieval",
    "tools",
]

[project]
name = "financial-assistant"
version = "0.1.0"
description = "Agentic financial research copilot — LangGraph + LiteLLM + Weaviate"
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",

    # LLM
    "litellm>=1.40.0",

    # Data fetching
    "yfinance>=0.2.40",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.45.0",
    "praw>=7.7.1",
    "feedparser>=6.0.11",
    "tavily-python>=0.3.3",
    "newsapi-python>=0.2.7",

    # PDF parsing
    "pymupdf>=1.24.0",

    # Vector store
    "weaviate-client>=4.6.0",
    "sentence-transformers>=3.0.0",

    # Pydantic / settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Frontend
    "streamlit>=1.36.0",
    "plotly>=5.22.0",

    # Numerics
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "pandas-ta>=0.3.14b",

    # Explainability
    "lime>=0.2.0.1",
    "scikit-learn>=1.5.0",

    # Evaluation
    "langsmith>=0.1.90",

    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=8.4.0",
    "cachetools>=5.4.0",
    "structlog>=24.2.0",
    "rich>=13.7.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
